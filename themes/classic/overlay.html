<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic — Lanecast theme</title>
<style>
:root{--accent:#74e5c1;--ink:#edf4fb;--muted:#9aaec2;--panel:rgba(11,17,25,.88)}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;color:var(--ink)}
/* Everything is sized from the picture's height (vh), so it scales with the program. */
.bug{position:absolute;left:3%;right:3%;bottom:5%;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .4s,transform .4s}
.bug.hidden{opacity:0;transform:translateY(20px)}
.top{display:flex;align-items:stretch;gap:.3vh}
.event{flex:1;background:var(--panel);backdrop-filter:blur(6px);border-left:.9vh solid var(--accent);padding:1.4vh 2.4vh;min-width:0}
.event span{display:block;font:700 1.8vh/1.3 system-ui;letter-spacing:.3vh;color:var(--accent)}
.event strong{display:block;font:700 4vh/1.2 system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.clock{background:var(--panel);backdrop-filter:blur(6px);padding:.8vh 3vh;font:700 6.4vh/1.2 ui-monospace,monospace;font-variant-numeric:tabular-nums;display:flex;align-items:center;min-width:22vh;justify-content:flex-end}
.clock.running{color:var(--accent)}
.lanes{list-style:none;margin:.3vh 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.3vh}
.lanes li{display:grid;grid-template-columns:4.4vh 1fr auto;gap:1.6vh;align-items:center;background:rgba(11,17,25,.78);padding:.6vh 2vh;font:600 2.4vh/1.4 system-ui;animation:in .35s ease-out both}
.lanes .n{color:var(--muted);font-variant-numeric:tabular-nums}
.lanes .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lanes small{color:var(--muted);font-weight:500;margin-left:1vh}
.lanes .t{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--accent)}
.lanes li.placed .n{color:var(--ink);font-weight:800}
.lanes li.placed.p1{background:rgba(116,229,193,.22)}
.banner{position:absolute;left:50%;top:14%;transform:translate(-50%,-50%) scale(.9);background:var(--accent);color:#10261f;font:800 4vh/1 system-ui;letter-spacing:.4vh;padding:1.6vh 4vh;border-radius:1vh;opacity:0;transition:opacity .3s,transform .3s;text-transform:uppercase}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@keyframes in{from{opacity:0;transform:translateX(-1.5vh)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bug hidden" id="bug">
<div class="top"><div class="event"><span id="eh">EVENT — · HEAT —</span><strong id="title"></strong></div><div class="clock" id="clock">0:00.0</div></div>
<ol class="lanes" id="lanes"></ol>
</div>
<div class="banner" id="banner"></div>
<script src="../lanecast-theme.js"></script>
<script>
(() => {
    const $ = id => document.getElementById(id);
    const row = (n, name, team, time, placed) => {
        const li = document.createElement('li'); if (placed) li.className = 'placed p' + placed;
        li.innerHTML = `<span class="n">${placed ? placed + '.' : n}</span><span class="name"></span><span class="t"></span>`;
        li.querySelector('.name').textContent = name; if (team) { const s = document.createElement('small'); s.textContent = team; li.querySelector('.name').append(s); }
        li.querySelector('.t').textContent = time; return li;
    };
    let shownKey = '';
    Lanecast.on('state', s => {
        $('bug').classList.toggle('hidden', !s.event);
        if (!s.event) return;
        $('eh').textContent = `EVENT ${s.event} · HEAT ${s.heat || '—'}`;
        $('title').textContent = s.title;
        $('clock').textContent = s.clock || '0:00.0'; $('clock').classList.toggle('running', s.running);
        // Before the start: the lineup. After: places and times as they come.
        const finished = s.lanes.filter(l => l.time && l.place).sort((a, b) => a.place - b.place);
        const rows = finished.length ? finished.map(l => row(l.lane, l.name, l.team, l.time, l.place)) : s.lanes.filter(l => l.name).map(l => row(l.lane, l.name, l.team, '', 0));
        // Only rebuild when the set changes, so the entry animation plays once per row.
        const key = rows.map(r => r.textContent).join('|');
        if (key !== shownKey) { shownKey = key; $('lanes').replaceChildren(...rows); }
    });
    const flash = (text, ms) => { $('banner').textContent = text; $('banner').classList.add('show'); clearTimeout(flash.t); flash.t = setTimeout(() => $('banner').classList.remove('show'), ms); };
    Lanecast.on('heat.finish', e => flash(`Heat ${e.heat} final`, 4000));
    Lanecast.on('event.finish', e => flash(`Event ${e.event} complete`, 5000));
    Lanecast.on('race.start', () => $('banner').classList.remove('show'));
})();
</script>
</body>
</html>
