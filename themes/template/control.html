<!doctype html>
<!--
  Lanecast theme template — the CONTROL PANEL.

  Optional. If theme.json names a "control" page, Lanecast shows it in a drawer down the right
  side of the Stream tab: portrait, like a phone, as tall as the picture and scrolling inside if
  you need more. The person running the stream can resize it by its edge or hide it. theme.json's
  "control.width" is the width it opens at; leave out "height" to fill the drawer.

  It is an ordinary page with the same runtime as the overlay; it gets the same state and events,
  and it can talk to the overlay:

    Lanecast.send({ anything })     arrives in the overlay as Lanecast.on('control', m => …)
    Lanecast.on('overlay', m => …)  the overlay's Lanecast.send(...) arrives here
    Lanecast.camera('Wide')         the panel can direct the picture too
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Template — control panel</title>
<style>
html, body { margin: 0; background: transparent; font: 13px system-ui, sans-serif; color: #edf4fb; }
body { padding: 14px 14px 20px; }
h2 { font-size: 10px; letter-spacing: 2px; color: #9aaec2; font-weight: 750; margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
.stack { display: grid; gap: 8px; }
button { background: #1e3041; border: 1px solid #3c5266; border-radius: 8px; color: #f4f8fc; font: 600 14px system-ui; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; }
button[aria-pressed="true"] { background: #ffcc33; border-color: #ffcc33; color: #111; }
.now { font-size: 12px; color: #9aaec2; margin: 6px 0 0; }
.now b { color: #edf4fb; }
</style>
</head>
<body>
<h2>GRAPHICS</h2>
<div class="stack">
  <button id="lanes" aria-pressed="true">Lane list</button>
  <button id="pip" aria-pressed="false">Picture in picture</button>
  <button id="moment">Say hello on the picture</button>
</div>
<h2>CAMERA</h2>
<div class="stack" id="cams"></div>
<h2>NOW</h2>
<p class="now" id="now">Waiting for the scoreboard…</p>

<script src="../lanecast-theme.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const toggle = (id, action) => $(id).onclick = () => { const on = $(id).getAttribute('aria-pressed') !== 'true'; $(id).setAttribute('aria-pressed', String(on)); Lanecast.send({ action, on }); };
  toggle('lanes', 'lanes');
  toggle('pip', 'pip');
  $('moment').onclick = () => Lanecast.send({ action: 'moment', text: 'Hello from the control panel' });
  // One button per camera, from the state; the one on the program is lit. A line about where the race is.
  let shown = '';
  Lanecast.on('state', s => {
    $('now').innerHTML = s.event ? `Event <b>${s.event}</b> heat <b>${s.heat}</b> · ${s.phase} · <b>${s.clock || '0:00.0'}</b>` : 'No event on the board';
    const key = s.cameras.map(c => c.id + ':' + c.name).join('|') + '#' + s.camera;
    if (key === shown) return; shown = key;
    $('cams').replaceChildren(...s.cameras.map(c => { const b = document.createElement('button'); b.textContent = c.name; b.setAttribute('aria-pressed', String(c.id === s.camera)); b.onclick = () => Lanecast.camera(c.id); return b; }));
  });
})();
</script>
</body>
</html>
