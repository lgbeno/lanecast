<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lanecast">
  <!-- Lanecast mark: two lane ropes, and the lane between them going live. -->
  <rect width="512" height="512" rx="116" fill="#0b1119"/>
  <g stroke="#74e5c1" stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="118" y1="170" x2="394" y2="170" stroke-dasharray="0.1 55.2" opacity=".55"/>
    <line x1="118" y1="342" x2="394" y2="342" stroke-dasharray="0.1 55.2" opacity=".55"/>
    <line x1="118" y1="256" x2="310" y2="256"/>
  </g>
  <circle cx="382" cy="256" r="30" fill="#4ade80"/>
</svg>
